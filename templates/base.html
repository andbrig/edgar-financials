<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EDGAR Financials{% endblock %}</title>
<style>
  :root { --ink:#1a1a1a; --mut:#666; --line:#e5e5e5; --bg:#fafafa; --acc:#0b5fff; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:var(--bg); margin:0; padding:0 16px 64px; }
  .wrap { max-width:1100px; margin:0 auto; }
  header { padding:20px 0 12px; border-bottom:1px solid var(--line); margin-bottom:20px;
           display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  header h1 { font-size:20px; margin:0; }
  header h1 a { color:var(--ink); text-decoration:none; }
  nav a { margin-left:16px; color:var(--acc); text-decoration:none; font-size:14px;}
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  thead th { background:#f2f2f2; position:sticky; top:0; }
  tbody tr:hover { background:#f7faff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px;
          padding:16px 18px; margin-bottom:20px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  .search { display:flex; gap:8px; }
  .search input { flex:1; padding:10px 12px; font-size:15px; border:1px solid var(--line);
                  border-radius:6px; }
  .search button { padding:10px 18px; background:var(--acc); color:#fff; border:0;
                   border-radius:6px; font-size:15px; cursor:pointer; }
  .mut { color:var(--mut); font-size:13px; }
  .neg { color:#c00; }
  ul.filings { list-style:none; padding:0; margin:0; font-size:13px; }
  ul.filings li { padding:6px 0; border-bottom:1px solid var(--line); }
  ul.filings a { color:var(--acc); text-decoration:none; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#f7f7f7; border-radius:6px; padding:10px 12px; }
  .stat .v { font-size:20px; font-weight:600; }
  .stat .l { font-size:12px; color:var(--mut); }
  canvas { max-height:320px; }
  .scrollx { overflow-x:auto; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
<header>
  <h1><a href="/">EDGAR Financials</a></h1>
  <nav><a href="/">Search</a><a href="/gaps">Data gaps</a></nav>
</header>
{% block body %}{% endblock %}
</div>
</body>
</html>
